<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Debt Maturity Ladder</title>
  <desc id="desc">A public-safe diagram showing repayments, family responsibilities, and funding windows on a shared household timeline.</desc>
  <rect width="1600" height="900" fill="#0d0e10"/>
  <g fill="none" stroke="#e9e2d5" stroke-opacity=".58"><path d="M140 160H1460M140 330H1460M140 500H1460M140 670H1460"/><path d="M140 730H1460" stroke-opacity=".8"/></g>
  <g stroke="#5c5f63" stroke-width="1" stroke-dasharray="3 10" opacity=".78"><path d="M280 130V760M520 130V760M760 130V760M1000 130V760M1240 130V760M1460 130V760"/></g>
  <g fill="#f1eadf" font-family="Arial, sans-serif"><text x="140" y="90" font-size="34" letter-spacing="2">DEBT MATURITY LADDER</text><text x="140" y="122" font-size="17" fill="#b9b4aa">REPAYMENT PRESSURE BECOMES CLEARER WHEN TIME, RESPONSIBILITIES, AND ACCESSIBLE FUNDING SHARE ONE VIEW</text><text x="42" y="220" font-size="18">REPAYMENTS</text><text x="42" y="390" font-size="18">RESPONSIBILITIES</text><text x="42" y="560" font-size="18">FUNDING</text><text x="140" y="805" font-size="18">TODAY</text><text x="487" y="805" font-size="18">YEAR 5</text><text x="727" y="805" font-size="18">YEAR 10</text><text x="967" y="805" font-size="18">YEAR 15</text><text x="1207" y="805" font-size="18">YEAR 20</text><text x="1410" y="805" font-size="18">+</text></g>
  <g><path d="M160 260H1370" stroke="#e9e2d5" stroke-width="7" stroke-linecap="round"/><path d="M160 260H760" stroke="#f39b11" stroke-width="10" stroke-linecap="round"/><path d="M760 260H1370" stroke="#e9e2d5" stroke-width="7" stroke-linecap="round" opacity=".6"/><circle cx="760" cy="260" r="15" fill="#f39b11"/><text x="170" y="237" fill="#f1eadf" font-family="Arial, sans-serif" font-size="20">HOUSING LOAN REPAYMENT PATH</text><text x="784" y="238" fill="#f39b11" font-family="Arial, sans-serif" font-size="18">review point</text></g>
  <g fill="none" stroke-linecap="round"><path d="M420 430H680" stroke="#f39b11" stroke-width="10"/><path d="M720 430H1060" stroke="#f39b11" stroke-width="10"/><path d="M1040 430H1280" stroke="#2878f0" stroke-width="10"/><circle cx="720" cy="430" r="16" fill="#f39b11"/><circle cx="1040" cy="430" r="16" fill="#2878f0"/></g>
  <g fill="#f1eadf" font-family="Arial, sans-serif" font-size="20"><text x="420" y="404">EDUCATION</text><text x="760" y="404">FAMILY SUPPORT</text><text x="1070" y="404">RETIREMENT TRANSITION</text></g>
  <g fill="none" stroke-linecap="round"><path d="M160 595C300 595 330 565 430 565S560 620 670 620 820 545 940 545 1080 570 1210 525 1350 500 1450 500" stroke="#2878f0" stroke-width="6"/><path d="M160 635C350 635 450 655 610 655S850 635 1010 635 1280 650 1450 650" stroke="#b9b4aa" stroke-width="3" stroke-dasharray="8 12"/><circle cx="670" cy="620" r="12" fill="#2878f0"/><circle cx="940" cy="545" r="12" fill="#2878f0"/><circle cx="1210" cy="525" r="12" fill="#2878f0"/></g>
  <g fill="#b9b4aa" font-family="Arial, sans-serif" font-size="18"><text x="170" y="685">accessible funding window</text><text x="170" y="715">assumptions and priorities require review</text></g>
