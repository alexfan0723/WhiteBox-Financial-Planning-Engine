<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Scenario map before recommendation</title>
  <desc id="desc">A dark WhiteBox-style diagram that moves from facts, assumptions, and constraints through three planning scenarios to expert review.</desc>
  <defs>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#f2ece2" stop-opacity=".2"/>
      <stop offset="1" stop-color="#f2ece2" stop-opacity="0"/>
    </linearGradient>
    <style>
      .label { fill:#f4eee5; font-family:Arial,sans-serif; font-size:22px; letter-spacing:.6px; }
      .sub { fill:#aaa7a1; font-family:Arial,sans-serif; font-size:15px; letter-spacing:.4px; }
      .line { stroke:#f4eee5; stroke-opacity:.52; fill:none; stroke-width:2; }
      .soft { stroke:#f4eee5; stroke-opacity:.18; fill:none; stroke-width:1; }
      .panel { fill:#121214; stroke:#f4eee5; stroke-opacity:.42; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#0c0c0e"/>
  <path d="M0 760H1600 M0 680H1600 M0 600H1600" class="soft"/>
  <text x="100" y="110" class="label" font-size="34">SCENARIOS BEFORE RECOMMENDATION</text>
  <text x="102" y="145" class="sub">facts, assumptions and constraints remain visible at every step</text>

  <g transform="translate(100 240)">
    <rect width="255" height="96" rx="4" class="panel"/>
    <circle cx="30" cy="48" r="8" fill="#ff9800"/>
    <text x="56" y="45" class="label">FACTS</text><text x="56" y="70" class="sub">confirmed household inputs</text>
    <rect y="125" width="255" height="96" rx="4" class="panel"/>
    <circle cx="30" cy="173" r="8" fill="#2878ff"/>
    <text x="56" y="170" class="label">ASSUMPTIONS</text><text x="56" y="195" class="sub">uncertain future conditions</text>
    <rect y="250" width="255" height="96" rx="4" class="panel"/>
    <circle cx="30" cy="298" r="8" fill="#f4eee5"/>
    <text x="56" y="295" class="label">CONSTRAINTS</text><text x="56" y="320" class="sub">cash flow and real choices</text>
  </g>

  <path d="M380 288H540 M380 413H540 M380 538H540" class="line"/>
  <path d="M540 288C640 288 650 320 735 320 M540 413H735 M540 538C640 538 650 506 735 506" class="line"/>
  <circle cx="735" cy="320" r="10" fill="#ff9800"/><circle cx="735" cy="413" r="10" fill="#2878ff"/><circle cx="735" cy="506" r="10" fill="#f4eee5"/>

  <g transform="translate(765 250)">
    <rect width="300" height="106" rx="4" class="panel"/>
    <text x="28" y="43" class="label">STEADY PATH</text><text x="28" y="75" class="sub">progress under stable conditions</text>
    <rect y="110" width="300" height="106" rx="4" class="panel"/>
    <text x="28" y="153" class="label">CASH-FLOW STRESS</text><text x="28" y="185" class="sub">pressure on essential commitments</text>
    <rect y="220" width="300" height="106" rx="4" class="panel"/>
    <text x="28" y="263" class="label">LIQUIDITY STRESS</text><text x="28" y="295" class="sub">access to resources when needed</text>
  </g>

  <path d="M1065 303C1140 303 1150 410 1230 410 M1065 413H1230 M1065 523C1140 523 1150 416 1230 416" class="line"/>
  <circle cx="1230" cy="413" r="16" fill="#0c0c0e" stroke="#f4eee5" stroke-width="2"/>
  <path d="M1246 413H1320" class="line"/>
  <g transform="translate(1320 348)">
    <rect width="190" height="130" rx="4" fill="#151518" stroke="#f4eee5" stroke-opacity=".72"/>
    <text x="24" y="51" class="label">EXPERT</text><text x="24" y="78" class="label">REVIEW</text>
    <text x="24" y="108" class="sub">interpret trade-offs</text>
  </g>
  <path d="M100 790H1500" stroke="url(#fade)" stroke-width="2"/>
  <circle cx="1070" cy="790" r="5" fill="#2878ff"/><circle cx="1120" cy="790" r="5" fill="#ff9800"/><circle cx="1170" cy="790" r="5" fill="#f4eee5"/>
</svg>
