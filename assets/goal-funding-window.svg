<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Goal Funding Window</title>
  <desc id="desc">A dark planning diagram showing three time-bound household goals, their funding windows, and resource paths with clear facts, assumptions, and expert review.</desc>
  <rect width="1600" height="900" fill="#111827"/>
  <path d="M80 160H1520M80 760H1520" stroke="#334155" stroke-width="2"/>
  <g fill="#F6F0E4" font-family="Arial, 'Microsoft YaHei', sans-serif">
    <text x="100" y="105" font-size="42" font-weight="700">GOAL FUNDING WINDOW</text>
    <text x="100" y="145" font-size="22" fill="#C9C2B6">A goal needs an amount, a time window, and a reviewable source of funding.</text>
  </g>
  <g stroke="#64748B" stroke-width="2">
    <path d="M160 665H1440"/>
    <path d="M160 645V685M416 645V685M672 645V685M928 645V685M1184 645V685M1440 645V685"/>
  </g>
  <g fill="#C9C2B6" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" text-anchor="middle">
    <text x="160" y="715">TODAY</text><text x="416" y="715">YEAR 1</text><text x="672" y="715">YEAR 2</text><text x="928" y="715">YEAR 3</text><text x="1184" y="715">YEAR 4</text><text x="1440" y="715">LONGER TERM</text>
  </g>
  <g fill="#1E3A5F" stroke="#60A5FA" stroke-width="3">
    <rect x="190" y="255" width="400" height="86" rx="14"/>
    <rect x="500" y="390" width="510" height="86" rx="14"/>
    <rect x="930" y="525" width="410" height="86" rx="14"/>
  </g>
  <g fill="#F6F0E4" font-family="Arial, 'Microsoft YaHei', sans-serif">
    <text x="220" y="291" font-size="24" font-weight="700">EDUCATION</text>
    <text x="220" y="320" font-size="18" fill="#C9C2B6">near-term, less deferrable</text>
    <text x="530" y="426" font-size="24" font-weight="700">FAMILY SUPPORT</text>
    <text x="530" y="455" font-size="18" fill="#C9C2B6">range and timing need review</text>
    <text x="960" y="561" font-size="24" font-weight="700">RETIREMENT</text>
    <text x="960" y="590" font-size="18" fill="#C9C2B6">longer transition, uncertain path</text>
  </g>
  <g fill="#7C2D12" stroke="#FB923C" stroke-width="3">
    <circle cx="590" cy="298" r="15"/><circle cx="1010" cy="433" r="15"/><circle cx="1340" cy="568" r="15"/>
  </g>
  <g stroke="#60A5FA" stroke-width="4" fill="none">
    <path d="M275 565 C355 505 418 400 500 340"/>
    <path d="M665 565 C750 525 830 500 930 476"/>
    <path d="M1100 565 C1165 580 1235 590 1290 610"/>
  </g>
  <g fill="#172554" stroke="#60A5FA" stroke-width="3">
    <rect x="150" y="540" width="250" height="88" rx="14"/>
    <rect x="535" y="540" width="250" height="88" rx="14"/>
    <rect x="1010" y="540" width="280" height="88" rx="14"/>
  </g>
  <g fill="#F6F0E4" font-family="Arial, 'Microsoft YaHei', sans-serif" text-anchor="middle">
    <text x="275" y="575" font-size="20" font-weight="700">ACCESSIBLE</text><text x="275" y="605" font-size="17">resources</text>
    <text x="660" y="575" font-size="20" font-weight="700">FUTURE INCOME</text><text x="660" y="605" font-size="17">assumptions</text>
    <text x="1150" y="575" font-size="20" font-weight="700">LONG-TERM</text><text x="1150" y="605" font-size="17">investments</text>
  </g>
  <g fill="#FB923C" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700">
    <text x="106" y="255">AMOUNT</text><text x="106" y="288">TIME</text><text x="106" y="321">CERTAINTY</text>
  </g>
  <text x="800" y="840" text-anchor="middle" fill="#F6F0E4" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="27">FACTS · ASSUMPTIONS · SCENARIOS · EXPERT REVIEW</text>
</svg>
