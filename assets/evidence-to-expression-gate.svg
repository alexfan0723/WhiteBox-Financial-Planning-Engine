<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Evidence-to-expression gate</title>
  <desc id="desc">A public-safe diagram showing evidence moving through a review gate before language advances from observation to interpretation, suitability, or action.</desc>
  <rect width="1600" height="900" fill="#10151d"/>
  <g fill="none" stroke="#34445a" stroke-width="1" opacity=".58">
    <path d="M90 150H1510M90 285H1510M90 420H1510M90 555H1510M90 690H1510M90 825H1510"/>
    <path d="M120 100V840M390 100V840M660 100V840M930 100V840M1200 100V840M1470 100V840"/>
  </g>
  <g font-family="Arial, Segoe UI, sans-serif">
    <text x="90" y="78" fill="#f4ead7" font-size="46" font-weight="500">EVIDENCE-TO-EXPRESSION GATE</text>
    <text x="93" y="118" fill="#aebdca" font-size="21" letter-spacing="1">A NEW INSIGHT MAY ENTER REVIEW · ITS LANGUAGE ADVANCES ONLY AS FAR AS THE EVIDENCE ALLOWS</text>

    <g transform="translate(90 205)">
      <text x="0" y="0" fill="#75a8d8" font-size="22" font-weight="500">01 EVIDENCE</text>
      <rect x="0" y="28" width="340" height="420" rx="4" fill="#151c25" stroke="#75a8d8" stroke-width="2"/>
      <text x="28" y="78" fill="#f4ead7" font-size="21">CONFIRMED FACTS</text>
      <text x="28" y="112" fill="#aebdca" font-size="17">What the household record states</text>
      <path d="M28 142H312" stroke="#405168"/>
      <text x="28" y="192" fill="#f4ead7" font-size="21">STATED ASSUMPTIONS</text>
      <text x="28" y="226" fill="#aebdca" font-size="17">What the scenario holds fixed</text>
      <path d="M28 256H312" stroke="#405168"/>
      <text x="28" y="306" fill="#f4ead7" font-size="21">SCENARIO COMPARISON</text>
      <text x="28" y="340" fill="#aebdca" font-size="17">What changes when one factor moves</text>
      <rect x="28" y="372" width="284" height="48" rx="24" fill="#13283a" stroke="#75a8d8"/>
      <text x="170" y="403" fill="#75a8d8" font-size="17" text-anchor="middle">REVIEWABLE BASIS</text>
    </g>

    <path d="M455 435H610" stroke="#75a8d8" stroke-width="5" stroke-linecap="round"/>
    <path d="M610 435l-18-11v22z" fill="#75a8d8"/>

    <g transform="translate(630 205)">
      <text x="0" y="0" fill="#f4ead7" font-size="22" font-weight="500">02 REVIEW GATE</text>
      <rect x="0" y="28" width="340" height="420" rx="4" fill="#171b20" stroke="#f4ead7" stroke-width="2"/>
      <circle cx="170" cy="116" r="52" fill="#17293a" stroke="#75a8d8" stroke-width="3"/>
      <path d="M145 116l17 18 36-40" fill="none" stroke="#75a8d8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="170" y="202" fill="#f4ead7" font-size="20" text-anchor="middle">CAN THE BASIS BE CHECKED?</text>
      <text x="170" y="246" fill="#f4ead7" font-size="20" text-anchor="middle">DOES THE SCOPE STILL MATCH?</text>
      <text x="170" y="290" fill="#f4ead7" font-size="20" text-anchor="middle">IS COUNTEREVIDENCE VISIBLE?</text>
      <path d="M42 326H298" stroke="#405168"/>
      <text x="170" y="366" fill="#ef8f3d" font-size="18" text-anchor="middle">UNSUPPORTED FORCE</text>
      <text x="170" y="396" fill="#aebdca" font-size="16" text-anchor="middle">NARROW THE WORDING</text>
    </g>

    <path d="M995 435H1150" stroke="#ef8f3d" stroke-width="5" stroke-linecap="round"/>
    <path d="M1150 435l-18-11v22z" fill="#ef8f3d"/>

    <g transform="translate(1170 205)">
      <text x="0" y="0" fill="#ef8f3d" font-size="22" font-weight="500">03 EXPRESSION</text>
      <rect x="0" y="28" width="340" height="420" rx="4" fill="#151c25" stroke="#ef8f3d" stroke-width="2"/>
      <g font-size="18">
        <rect x="26" y="62" width="288" height="58" rx="4" fill="#17293a" stroke="#75a8d8"/>
        <text x="48" y="98" fill="#f4ead7">OBSERVATION</text>
        <rect x="26" y="139" width="288" height="58" rx="4" fill="#1b252d" stroke="#6786a1"/>
        <text x="48" y="175" fill="#f4ead7">CONDITIONAL INTERPRETATION</text>
        <rect x="26" y="216" width="288" height="58" rx="4" fill="#28231e" stroke="#b87942"/>
        <text x="48" y="252" fill="#f4ead7">SUITABILITY JUDGMENT</text>
        <rect x="26" y="293" width="288" height="58" rx="4" fill="#302219" stroke="#ef8f3d"/>
        <text x="48" y="329" fill="#f4ead7">ACTION RECOMMENDATION</text>
      </g>
      <text x="170" y="396" fill="#ef8f3d" font-size="17" text-anchor="middle">MORE FORCE REQUIRES MORE SUPPORT</text>
    </g>

    <rect x="450" y="718" width="700" height="70" rx="35" fill="#151c25" stroke="#405168"/>
    <text x="800" y="748" fill="#f4ead7" font-size="20" text-anchor="middle">CLAIM STRENGTH MUST NOT EXCEED EVIDENCE ENTITLEMENT</text>
    <text x="800" y="777" fill="#aebdca" font-size="16" text-anchor="middle">NOVEL INSIGHT REMAINS WELCOME · PROFESSIONAL COMMITMENT REMAINS REVIEWABLE</text>

    <g font-size="16">
      <circle cx="98" cy="850" r="7" fill="#75a8d8"/><text x="116" y="856" fill="#aebdca">EVIDENCE AND VERIFICATION</text>
      <circle cx="360" cy="850" r="7" fill="#ef8f3d"/><text x="378" y="856" fill="#aebdca">CLAIM FORCE AND RESPONSIBILITY</text>
      <text x="1505" y="856" fill="#aebdca" text-anchor="end">PUBLIC RESEARCH ILLUSTRATION · NOT INDIVIDUAL FINANCIAL ADVICE</text>
    </g>
  </g>
</svg>
